<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anide Media - Anime Sayti</title>
    <link rel="stylesheet" href="style.css">
    <link href="fonts.googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="sakura-container"></div>
    <header>
        <div class="container header-content">
            <div class="logo">ANIDE MEDIA</div>
            <nav>
                <a href="#">ANIME</a>
                <a href="#">FILM</a>
                <a href="#">MULTIFILM</a>
            </nav>
            <!-- ID qo'shilgan qidiruv maydoni -->
            <div class="search-box">
                <input type="text" id="anime-search" placeholder="Anime qidirish...">
            </div>
        </div>
    </header>

    <main class="container">
        <h1>Anime Saytga Xush kelibsiz!</h1>
        <p>Bu yerda animelarni tomosha qiling</p>

        <section class="movie-grid">
            <!-- Har bir kartochka A tegi ichiga olingan -->
            <a href="detail.html" class="movie-card-link">
                <div class="movie-card">
                    <img src="lookism.jpg" alt="Lookism poster">
                    <div class="card-content">
                        <h3>LOOKISM</h3>
                        <div class="card-details">
                            <span class="rating">⭐️ 8.5</span>
                            <span class="genre">Anime / Drama</span>
                        </div>
                    </div>
                </div>
            </a>
            <a href="detail.html" class="movie-card-link">
                <div class="movie-card">
                    <img src="iblislar_qotili.jpg" alt="Iblislar Qotili poster">
                    <div class="card-content">
                        <h3>IBLISLAR QOTILI</h3>
                        <div class="card-details">
                            <span class="rating">⭐️ 8.5</span>
                            <span class="genre">Anime / Drama</span>
                        </div>
                    </div>
                </div>
            </a>
             <a href="detail.html" class="movie-card-link">
                <div class="movie-card">
                    <img src="arra_odam.jpg" alt="Arra Odam poster">
                    <div class="card-content">
                        <h3>ARRA ODAM</h3>
                        <div class="card-details">
                            <span class="rating">⭐️ 8.5</span>
                            <span class="genre">Anime / Drama</span>
                        </div>
                    </div>
                </div>
            </a>
            <!-- Qo'shimcha kartochkalarni shu yerga qo'shing -->
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
